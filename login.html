<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | District Urban Empire</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    body { margin: 0; padding: 0; background-color: #030303; }

    .auth-fullscreen {
        width: 100%; min-height: calc(100vh - 80px); background-color: #111; 
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(120, 120, 120, 0.35) 0%, rgba(10, 10, 10, 1) 85%),
            linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
        display: flex; align-items: center; justify-content: center;
        position: relative; padding: 40px 20px; box-sizing: border-box; overflow: hidden;
    }

    .auth-fullscreen::before {
        content: 'URBAN'; position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%); font-family: 'Bebas Neue', sans-serif;
        font-size: 30vw; color: rgba(255, 255, 255, 0.025); 
        white-space: nowrap; z-index: 0; pointer-events: none; letter-spacing: -5px;
    }

    .glass-card {
        position: relative; z-index: 1; width: 100%; max-width: 450px;
        background: rgba(20, 20, 20, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px;
        padding: 45px 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .glass-card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: #fff; text-align: center; margin: 0 0 30px 0; letter-spacing: 2px; }
    .glass-card h2 span { color: #bbb78b; }

    .glass-tabs { display: flex; background: rgba(0, 0, 0, 0.6); border-radius: 10px; padding: 5px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); }
    .glass-tab-btn { flex: 1; background: transparent; color: #777; border: none; padding: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1.5px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
    .glass-tab-btn.active { background: rgba(255, 255, 255, 0.12); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

    .auth-form { display: none; flex-direction: column; gap: 20px; animation: fadeUp 0.4s ease; }
    .auth-form.active { display: flex; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .glass-input input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #fff; font-family: 'Montserrat', sans-serif; font-size: 14px; padding: 16px; outline: none; box-sizing: border-box; transition: all 0.3s ease; }
    .glass-input input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #0a0a0a inset !important; -webkit-text-fill-color: #fff !important; }
    .glass-input input:focus { border-color: #fff; background: rgba(0, 0, 0, 0.8); }
    .glass-input input::placeholder { color: #888; font-weight: 500;}

    .form-options { display: flex; justify-content: space-between; align-items: center; margin-top: -5px; }
    .form-options label { font-family: 'Montserrat', sans-serif; font-size: 12px; color: #999; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .form-options a { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; color: #fff; text-decoration: none; }
    .form-options a:hover { text-decoration: underline; color: #bbb78b; }

    .glass-btn { width: 100%; background: #fff; color: #000; border: none; border-radius: 8px; padding: 18px; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
    .glass-btn:hover { background: #bbb78b; color: #000; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

    #custom-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600; padding: 16px 24px; border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; gap: 12px; opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease; }
    #custom-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #custom-toast.success { border-bottom: 3px solid #16a34a; }
    #custom-toast.error { border-bottom: 3px solid #dc2626; }
  </style>
</head>
<body>
  
  <div id="site-header"></div>

  <div id="custom-toast">
      <span id="toast-icon"></span>
      <span id="toast-message">Mensaje</span>
  </div>

  <main class="auth-fullscreen">
      <div class="glass-card">
          <h2>DISTRICT <span>EMPIRE</span></h2>
          
          <div class="glass-tabs">
              <button class="glass-tab-btn active" id="tab-login" onclick="switchTab('login')">LOGIN</button>
              <button class="glass-tab-btn" id="tab-register" onclick="switchTab('register')">REGISTRO</button>
          </div>

          <form id="form-login" class="auth-form active" onsubmit="processLogin(event)">
              <div class="glass-input">
                  <input id="login-email" type="email" required placeholder="Correo Electrónico" autocomplete="email">
              </div>
              <div class="glass-input">
                  <input id="login-pass" type="password" required placeholder="Contraseña">
              </div>
              <div class="form-options">
                  <label><input type="checkbox" style="accent-color: #bbb78b;"> Recordarme</label>
                  <a href="#">¿Olvidaste tu clave?</a>
              </div>
              <button type="submit" class="glass-btn">ENTRAR AL SISTEMA</button>
          </form>

          <form id="form-register" class="auth-form" onsubmit="processRegister(event)">
              <div class="glass-input">
                  <input id="reg-name" type="text" required placeholder="Nombre Completo" autocomplete="name">
              </div>
              <div class="glass-input">
                  <input id="reg-email" type="email" required placeholder="Correo Electrónico" autocomplete="email">
              </div>
              <div class="glass-input">
                  <input id="reg-pass" type="password" required placeholder="Crea una Contraseña">
              </div>
              <button type="submit" class="glass-btn">CREAR MI CUENTA</button>
          </form>
      </div>
  </main>

  <div id="site-footer"></div>
  
  <script src="script.js"></script>
  
  <script>
    function switchTab(type) {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (type === 'login') {
        tabLogin.classList.add('active'); tabRegister.classList.remove('active');
        formLogin.classList.add('active'); formRegister.classList.remove('active');
      } else {
        tabRegister.classList.add('active'); tabLogin.classList.remove('active');
        formRegister.classList.add('active'); formLogin.classList.remove('active');
      }
    }

    let toastTimeout;
    function showNotification(message, type) {
        const toast = document.getElementById('custom-toast');
        const icon = document.getElementById('toast-icon');
        const text = document.getElementById('toast-message');

        clearTimeout(toastTimeout);
        text.textContent = message;
        toast.className = ''; 

        if(type === 'success') {
            toast.classList.add('success');
            icon.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        } else {
            toast.classList.add('error');
            icon.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#dc2626" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
        }

        setTimeout(() => toast.classList.add('show'), 10);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3500);
    }

    function processRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-pass').value;

      localStorage.setItem('district_account', JSON.stringify({ nombre: name, correo: email, clave: pass }));
      showNotification('¡Cuenta creada con éxito! Inicia sesión ahora.', 'success');
      switchTab('login');
      e.target.reset(); 
    }

    function processLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      const savedData = localStorage.getItem('district_account');

      if (!savedData) { showNotification('Acceso denegado. Regístrate primero.', 'error'); return; }
      
      const user = JSON.parse(savedData);
      
      if (user.correo !== email) { showNotification('Este correo no está registrado.', 'error'); return; }
      if (user.clave !== pass) { showNotification('Contraseña incorrecta. Inténtalo de nuevo.', 'error'); return; }

      // AQUÍ SE CREA LA SESIÓN VIRTUAL PARA PERMITIR COMPRAR
      localStorage.setItem('district_session', 'active');
      showNotification('¡Bienvenido de nuevo, ' + user.nombre + '!', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    }
  </script>
</body>
</html>
