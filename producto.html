<!-- producto.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de Producto | District.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-banner">
    <h1>DETALLE DE PRODUCTO</h1>
    <p class="sub-portada">INICIO - CATÁLOGO - PRODUCTO</p>
  </section>

  <main style="padding: 50px 0;">
    <div class="product-detail-container">
      <div class="product-gallery">
        <img id="main-image" class="main-image" src="" alt="Producto">
        <div class="thumbnails"></div>
      </div>
      <div class="product-info">
        <h1 id="product-title">CARGANDO...</h1>
        <div class="price" id="product-price">$0.00</div>
        <p id="product-desc"></p>
        <hr class="divider">
        <ul id="product-details-list"></ul>
        <div class="color-selection">
          <strong>COLOR:</strong> <span style="font-weight: 400; color: #555;">Estándar</span>
          <div class="swatches">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <div class="add-to-cart-row">
          <!-- Inyectado mediante script.js -->
        </div>
      </div>
    </div>

    <section class="related-products-section">
      <div class="title-with-lines">
        <h2>TAMBIEN PODRIA INTERESARTE</h2>
      </div>
      <div class="product-grid" data-products="recommendations"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
