<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito de Compras | District.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  
  <section class="portada-unica-catalogo">
    <h1 class="titulo-portada">CARRITO DE COMPRAS</h1>
    <p class="sub-portada">INICIO - CARRITO DE COMPRAS</p>
  </section>

  <main class="cart-page">
    <div class="cart-container">
      <div class="cart-items" id="cart-items"></div>
      
      <div class="cart-summary">
        <h2>RESUMEN DEL PEDIDO</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Envío</span>
          <span id="cart-shipping">$0.00</span>
        </div>
        <div class="summary-row total-row">
          <span>TOTAL</span>
          <span id="cart-total">$0.00</span>
        </div>
        <a href="checkout.html" class="btn-checkout">PROCEDER AL PAGO</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
