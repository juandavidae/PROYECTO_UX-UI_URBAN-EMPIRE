<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Hombre | District.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  
  <section class="portada-unica-catalogo">
    <h1 class="titulo-portada">HOMBRE</h1>
    <p class="sub-portada">INICIO - HOMBRE</p>
  </section>

  <!-- Contenedor general en dos columnas -->
  <div class="catalog-layout">
    
    <!-- Menú lateral izquierdo idéntico a tu diseño -->
    <aside class="filters">
      <h2>CATEGORÍAS</h2>
      <ul>
        <li>Accesorios</li>
        <li>Calzado</li>
        <li>Camisetas</li>
        <li>Camisetas Oversize</li>
        <li>Chaquetas</li>
        <li>Gafas</li>
        <li>Pantalones</li>
        <li>Hoddies</li>
        <li>Bermudas</li>
      </ul>
      
      <h2 style="margin-top: 35px;">FILTRAR POR</h2>
      
      <h3>TALLA</h3>
      <ul>
        <li><label style="cursor: pointer;"><input type="checkbox"> S</label></li>
        <li><label style="cursor: pointer;"><input type="checkbox"> M</label></li>
        <li><label style="cursor: pointer;"><input type="checkbox"> L</label></li>
        <li><label style="cursor: pointer;"><input type="checkbox"> XL</label></li>
        <li><label style="cursor: pointer;"><input type="checkbox"> XXL</label></li>
      </ul>

      <h3 style="margin-top: 25px;">COLOR</h3>
      <div class="swatches">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
      </div>
    </aside>
    
    <!-- Zona derecha: Herramientas y productos -->
    <main class="catalog">
      <div class="catalog-toolbar">
        <div class="view-icons"></div>
        <select>
          <option>Ordenar por</option>
          <option>Precio: Menor a Mayor</option>
          <option>Precio: Mayor a Menor</option>
          <option>Más recientes</option>
        </select>
      </div>
      
      <!-- Cuadrícula donde tu JavaScript inyecta los productos -->
      <div class="product-grid" data-products="men"></div>
    </main>

  </div>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
