<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito | District.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-banner">
    <h1>CARRITO DE COMPRAS</h1>
    <p>INICIO - HOMBRE - CAMISETAS OVERSIZE - CARRITO</p>
  </section>

  <main class="cart-page">
    <section>
      <h2>CARRITO DE COMPRAS</h2>
      <div id="cart-items"></div>
      <a class="olive-button checkout-link" href="checkout.html">IR AL CHECKOUT</a>
    </section>

    <aside class="order-summary">
      <h2>RESUMEN</h2>
      <p>Subtotal: <strong id="cart-subtotal">$0.00</strong></p>
      <p>Envío: <strong>$3.50</strong></p>
      <hr>
      <p class="total">Total: <strong id="cart-total">$3.50</strong></p>
      <a class="olive-button" href="checkout.html">PAGAR AHORA</a>
    </aside>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
